[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arkai"
version = "0.1.0"
description = "Local AI inference workflow management"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache License 2.0"}
authors = [{name = "arkai contributors"}]

dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
rag = [
    "pymupdf>=1.23.0",
    "markdown>=3.4",
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.0",
    "behave>=1.2.6",
    "ruff>=0.1.0",
    "ty>=0.0.74",
    "coverage[toml]>=7.10",
    "packaging",
]

[project.scripts]
arkai = "arkai.cli:main"

[tool.setuptools]
packages = ["arkai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.coverage.run]
branch = true
source = ["arkai"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4"]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=100]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ty-check
        name: ty type checker
        entry: ty check
        language: system
        pass_filenames: true
        files: \.py$

      - id: pytest
        name: pytest
        entry: pytest tests/unit/
        language: system
        types: [python]
        pass_filenames: false

      - id: behave
        name: behave
        entry: behave
        language: system
        types: [python]
        pass_filenames: false
